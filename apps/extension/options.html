<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>智藏 ZhiCang 设置</title>
    <style>
      body {
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        max-width: 480px;
        margin: 40px auto;
        color: #1f1f1f;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin: 16px 0 6px;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 14px;
      }
      .hint {
        font-size: 12px;
        color: #888;
        margin-top: 6px;
      }
      #saved {
        color: #16a34a;
        margin-left: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>智藏 ZhiCang 收藏助手 · 设置</h1>
    <label for="port">桌面端本地桥接端口</label>
    <input id="port" type="number" placeholder="38121" />
    <div class="hint">需与桌面端「设置 → 网络服务」中的端口一致，默认 38121。</div>
    <label for="token">访问令牌</label>
    <input id="token" type="password" autocomplete="off" placeholder="粘贴桌面端「设置 → 网络服务 → 访问令牌」" />
    <div class="hint">从桌面端「设置 → 网络服务 → 访问令牌」复制粘贴。无令牌将无法保存收藏（仅 127.0.0.1 可访问）。</div>
    <button id="save">保存</button>
    <span id="saved"></span>
    <button id="test" type="button">测试桌面连接与令牌</button><p id="connection" role="status"></p><script src="options.js"></script>
  </body>
</html>
