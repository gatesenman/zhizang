name: Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux zip
          - os: windows-2022
            target: --win nsis --x64
          - os: macos-latest
            target: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @zhicang/shared build

      # Keep pnpm/lockfile unchanged; its node-gyp 10 supports VS2022, not VS2026.
      - name: Verify reviewed NSIS security template
        run: node scripts/assert-windows-packaging.mjs

      - name: Build & package desktop
        run: pnpm --filter @zhicang/desktop exec electron-vite build && pnpm --filter @zhicang/desktop exec electron-builder ${{ matrix.target }} --publish never

      - name: Smoke packaged Windows Electron and persistent native SQLite
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows-package.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zhicang-${{ matrix.os }}
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/BUILD-PROVENANCE.json
          if-no-files-found: error
